name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test windows/SqueezeBar.Core.Tests
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: macOS
