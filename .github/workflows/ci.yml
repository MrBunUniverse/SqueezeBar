name: CI
on:
  push:
    branches: [main]
  pull_request:
# Read-only token: CI only builds and tests.
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commits (tags can be moved); the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x
      - run: dotnet test windows/SqueezeBar.Core.Tests
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: swift test
        working-directory: macOS
